site_name: EasyPrefix
site_description: Prefixes, suffixes, tags, chat colors, tab list and name tags for Paper - configured in a GUI.
site_url: https://itsthechris07.github.io/EasyPrefix/
repo_url: https://github.com/itsthechris07/EasyPrefix
repo_name: itsthechris07/EasyPrefix
edit_uri: edit/master/docs/
copyright: EasyPrefix by Christian34 - MIT License

nav:
  - Home: README.md
  - Server owners:
      - getting-started.md
      - commands.md
      - permissions.md
      - groups-and-tags.md
      - colors-and-formatting.md
      - configuration.md
      - tab-list-and-name-tags.md
      - placeholders.md
      - mysql.md
      - faq.md
  - Developers:
      - development.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  # dark first, like the banner - colors in stylesheets/brand.css
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/itsthechris07/EasyPrefix
      name: GitHub
    - icon: material/download
      link: https://modrinth.com/plugin/easyprefix-christian34
      name: Modrinth

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/wordmark.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    anchors: warn
