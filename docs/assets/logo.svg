<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <title>EasyPrefix</title>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2a2f63"/>
            <stop offset="1" stop-color="#151833"/>
        </linearGradient>
        <linearGradient id="prefix" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff5555"/>
            <stop offset="1" stop-color="#ffaa00"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- background -->
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>

    <!-- chat bubble -->
    <g filter="url(#shadow)">
        <path d="M124 116 H388 A48 48 0 0 1 436 164 V308 A48 48 0 0 1 388 356 H208 L130 420 L144 356 H124 A48 48 0 0 1 76 308 V164 A48 48 0 0 1 124 116 Z"
              fill="#f4f5fb"/>
    </g>

    <!-- line 1: gradient prefix with a star + name -->
    <rect x="112" y="158" width="122" height="56" rx="28" fill="url(#prefix)"/>
    <path d="M173 169 L177.1 180.3 L189.2 180.8 L179.7 188.2 L183 199.8 L173 193 L163 199.8 L166.3 188.2 L156.8 180.8 L168.9 180.3 Z"
          fill="#ffffff"/>
    <rect x="250" y="172" width="150" height="28" rx="14" fill="#3b4270"/>

    <!-- line 2 + 3: message in chat colors -->
    <rect x="112" y="244" width="148" height="26" rx="13" fill="#4fd1e8"/>
    <rect x="274" y="244" width="126" height="26" rx="13" fill="#7bd88f"/>
    <rect x="112" y="290" width="212" height="26" rx="13" fill="#c9cde8"/>
</svg>