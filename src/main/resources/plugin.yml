name: EasyPrefix
version: ${version}
description: Prefixes, suffixes, groups, tags and chat colors with a GUI
author: Christian34
website: https://github.com/itsthechris07/EasyPrefix
main: com.christian34.easyprefix.EasyPrefix
# the oldest supported version (dialogs); the old enum calls of the shaded InventoryGui are rewritten by the build
api-version: "1.21.7"
# the region schedulers of Paper are used, so the same jar runs on Paper and Folia
folia-supported: true
softdepend:
  - PlaceholderAPI
  - Vault