# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "annotations"
      # compiled against the oldest supported version on purpose (1.21.x servers run on Java 21);
      # dependabot would bump it together with the test paper-api, so that one is bumped by hand with MockBukkit
      - dependency-name: "io.papermc.paper:paper-api"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
