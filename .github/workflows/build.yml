# Builds the plugin and runs the tests on every push and pull request (releases: release.yml).
name: Build

on:
  push:
    branches: [ master ]
    paths-ignore: [ "docs/**", "**.md", "mkdocs.yml", "assets/**" ]
  pull_request:
    paths-ignore: [ "docs/**", "**.md", "mkdocs.yml", "assets/**" ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          # the wrapper is not in the repository
          gradle-version: "9.8.0"

      - name: Build (with tests)
        run: gradle :build

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
